apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: expenses-tracker
  namespace: argocd
  # Finalizer ensures Argo CD cleans up K8s resources when the Application is deleted
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/sudarshanvashisht/Expenses-Tracker-GitOps.git
    targetRevision: main
    path: overlays/kind

  destination:
    server: https://kubernetes.default.svc
    namespace: expenses

  syncPolicy:
    automated:
      prune: true       # Remove resources that are no longer in Git
      selfHeal: true     # Revert manual changes to match Git state
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
