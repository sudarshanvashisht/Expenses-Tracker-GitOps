apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenses-tracker
  namespace: expenses
  labels:
    app.kubernetes.io/name: expenses-tracker
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: expenses-tracker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: expenses-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: expenses-tracker
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: expenses-tracker
    spec:
      # Wait for MySQL to be ready before starting the app
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL to be ready..."
              until nc -z mysql 3306; do
                echo "MySQL is not ready yet — sleeping 5s"
                sleep 5
              done
              echo "MySQL is ready!"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: expenses-tracker
          image: sudarshan0907/expenses-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/expenses_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
          # Using TCP socket probes since actuator is not in the original app.
          # For production, add spring-boot-starter-actuator and use HTTP /actuator/health
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
